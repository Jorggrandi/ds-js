<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">

    <title>Cadastro</title>
</head>
<body>
    <main class="card-home">
        <form id="newUser">
            <h2 id="welcome-msg">Meu cadastro</h2>
            <input type="text" name="username" id="username-input" required placeholder="Seu nome">
            <input type="password" name="newPassword" id="newPassword" required placeholder="Nova senha">
            <button>Cadastrar</button>
            <button onclick="exit()" id="exitButton">Voltar</button>
        </form>
    </main>

    <script>
        const loggedUser = localStorage.getItem("userAuthed")

        if(!loggedUser){
            window.location.href = "/"
        }
        document.querySelector("#exitButton").addEventListener("click", () => {
            window.location.href = "/home"
        })
    </script>

    <script src="../script.js"></script>
</body>
</html>
