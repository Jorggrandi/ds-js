<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="card-home">
        <h1>GymCana do senai</h1>
        <p>Bem vindo </p>

        <p id="welcome-msg">Treino Liberado</p>
        <button id="exitButton">Sair</button>
    </div>

    <script src="script.js">

        const authUser = sessionStorage.getItem("userAuthed")
        if(!authUser){
            window.location.href = `index.html`
        }else{
            document.querySelector("#welcome-msg").textContent = `Bem vindo ${localStorage.getItem("userAuthed")}!`
        }

        document.querySelector("#exitButton").addEventListener("click", (e) => {
            localStorage.removeItem("logged")
            window.location.href = "index.html"
        })
    </script>
</body>
</html>
